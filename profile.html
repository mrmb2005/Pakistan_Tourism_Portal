<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Profile — Explore Pakist3. C:\Python314\python.exe app.pyan</title>

  <!-- Fonts & Libraries -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root{
      --rose-100: #fdeef1;
      --rose-200: #f7d9df;
      --rose-300: #eebfc9;
      --rose-500: #b85c72;
      --ivory: #fffdfd;
      --muted: #6a6a6a;
      --card-shadow: 0 8px 20px rgba(184,92,114,0.06);
      --soft-shadow: 0 6px 18px rgba(32,32,32,0.05);
      --nav-height: 68px;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    *{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{
      font-family:"Poppins",system-ui,Segoe UI,Roboto,Helvetica,Arial;
      background:var(--ivory);
      color:#333;
      line-height:1.4;
      padding-top:var(--nav-height);
    }

    /* NAVBAR - Same as front end code.html */
    nav{
      position:fixed;inset:auto 0 0 0; top:0; left:0; right:0;
      height:var(--nav-height);
      display:flex;align-items:center;justify-content:space-between;
      padding:12px 36px;
      background:rgba(239, 187, 187, 0.85);
      backdrop-filter: blur(6px);
      border-bottom:1px solid rgba(184,92,114,0.04);
      z-index:1200;
    }
    nav .brand{color:var(--rose-500); font-weight:600; font-size:1.05rem;}
    nav .navlinks{display:flex;gap:18px;align-items:center}
    nav .navlinks a{color:#444;text-decoration:none;font-weight:500;padding:6px 8px;border-radius:8px;}
    nav .navlinks a:hover{color:#fff;background:var(--rose-300);}

    /* Buttons */
    .btn-ghost {
      padding: 8px 16px;
      border-radius: 999px;
      border: 2px solid var(--rose-200);
      background: transparent;
      cursor: pointer;
      font-weight: 600;
      transition: all .18s;
      color: #444;
      text-decoration: none;
      display: inline-block;
    }
    .btn-ghost:hover {
      background: var(--rose-500);
      color: #fff;
      transform: translateY(-3px);
      border-color: var(--rose-500);
    }
    .btn-primary{padding:8px 16px;border-radius:999px;border:none;background:var(--rose-200);cursor:pointer;font-weight:600;transition:all .18s;color:#2b2b2b;text-decoration:none;display:inline-block}
    .btn-primary:hover{background:var(--rose-500);color:#fff;transform:translateY(-3px)}

    .btn-danger {
      padding: 8px 16px;
      border-radius: 999px;
      border: none;
      background: var(--danger);
      cursor: pointer;
      font-weight: 600;
      transition: all .18s;
      color: white;
    }
    .btn-danger:hover {
      background: #dc2626;
      transform: translateY(-3px);
    }

    /* SECTION WRAPPER */
    .section{max-width:1200px;margin:48px auto;padding:0 20px}
    .title{font-size:1.6rem;color:var(--rose-500);text-align:center;margin-bottom:22px;font-weight:600}

    /* Profile Header */
    .profile-header {
      background: linear-gradient(135deg, var(--rose-200) 0%, var(--rose-300) 100%);
      padding: 48px 20px;
      border-radius: 18px;
      margin-bottom: 32px;
      text-align: center;
      box-shadow: var(--card-shadow);
    }

    .profile-header h1 {
      color: var(--rose-500);
      font-size: 2.2rem;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .profile-header .email {
      color: var(--muted);
      font-size: 1.1rem;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      gap: 22px;
      grid-template-columns: repeat(1, 1fr);
      margin-bottom: 48px;
    }
    @media(min-width:640px) { 
      .stats-grid {grid-template-columns: repeat(3, 1fr)} 
    }

    .stat-card {
      background: white;
      border-radius: 18px;
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--soft-shadow);
      transition: transform .35s cubic-bezier(.2,.9,.2,1), box-shadow .35s;
    }

    .stat-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--card-shadow);
    }

    .stat-card .number {
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--rose-500);
      margin-bottom: 8px;
    }

    .stat-card .label {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Bookings Section */
    .bookings-section {
      background: white;
      border-radius: 18px;
      padding: 32px;
      box-shadow: var(--soft-shadow);
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 1.6rem;
      color: var(--rose-500);
      margin-bottom: 28px;
      font-weight: 600;
    }

    /* Booking Cards */
    .bookings-grid {
      display: grid;
      gap: 22px;
      grid-template-columns: repeat(1, 1fr);
    }
    @media(min-width:640px) { 
      .bookings-grid {grid-template-columns: repeat(2, 1fr)} 
    }

    .booking-card {
      background: var(--rose-100);
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      transition: transform .35s cubic-bezier(.2,.9,.2,1), box-shadow .35s;
      box-shadow: var(--soft-shadow);
      border: 2px solid transparent;
    }

    .booking-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--card-shadow);
      border-color: var(--rose-300);
    }

    .booking-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .booking-header h3 {
      font-size: 1.25rem;
      color: var(--rose-500);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .booking-id {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .status-badge {
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
    }

    .status-confirmed {
      background: #d1fae5;
      color: #065f46;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .booking-details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }

    .detail-item {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .detail-item strong {
      color: #333;
    }

    .booking-price {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--rose-500);
      text-align: right;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 64px 20px;
      color: var(--muted);
    }

    .empty-state h3 {
      font-size: 1.5rem;
      color: var(--rose-500);
      margin-bottom: 12px;
    }

    .empty-state p {
      margin-bottom: 24px;
      font-size: 1.05rem;
    }

    /* Loading */
    .loading {
      text-align: center;
      padding: 48px;
      font-size: 1.2rem;
      color: var(--muted);
    }

    .loading::after {
      content: '...';
      animation: dots 1.5s steps(4, end) infinite;
    }

    @keyframes dots {
      0%, 20% { content: '.'; }
      40% { content: '..'; }
      60%, 100% { content: '...'; }
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 2000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      overflow: auto;
      background-color: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: var(--ivory);
      margin: 10% auto;
      padding: 28px 32px;
      border-radius: 18px;
      width: 520px;
      max-width: 90%;
      box-shadow: var(--card-shadow);
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid var(--rose-100);
    }

    .modal-header h2 {
      font-size: 1.6rem;
      color: var(--rose-500);
      font-weight: 600;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 2rem;
      color: var(--muted);
      cursor: pointer;
      line-height: 1;
      padding: 0;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: var(--rose-200);
      color: var(--rose-500);
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid var(--rose-100);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      color: var(--muted);
      font-weight: 500;
    }

    .detail-value {
      color: #333;
      font-weight: 600;
      text-align: right;
    }

    /* Footer */
    footer {
      padding: 28px;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* Cancel Button */
    .btn-cancel {
      flex: 1;
      min-width: 200px;
      padding: 14px 24px;
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
    }

    .btn-cancel:hover:not(:disabled) {
      background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.3);
      transform: translateY(-2px);
    }

    .btn-cancel:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Download Button */
    .btn-download {
      flex: 1;
      min-width: 200px;
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--rose-500) 0%, #a04a5f 100%);
      color: white;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(184, 92, 114, 0.2);
    }

    .btn-download:hover:not(:disabled) {
      background: linear-gradient(135deg, #a04a5f 0%, #8a3f52 100%);
      box-shadow: 0 6px 20px rgba(184, 92, 114, 0.3);
      transform: translateY(-2px);
    }

    .btn-download:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav {
        padding: 12px 20px;
      }

      nav .navlinks {
        gap: 12px;
      }

      .profile-header h1 {
        font-size: 1.8rem;
      }

      .booking-details {
        grid-template-columns: 1fr;
      }

      .modal-content {
        width: 95%;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <!-- NAVBAR - Same as front end code.html -->
  <nav>
    <div style="display:flex;gap:16px;align-items:center">
      <div class="brand">Explore Pakistan</div>
    </div>

    <div class="navlinks" id="navlinks">
      <a href="front end code.html">Home</a>
      <a href="hotel bookings.html">Book Hotel</a>
      <a href="profile.html" style="color:var(--rose-500);">Profile</a>
      <button id="logoutBtn" class="btn-danger">Logout</button>
    </div>
  </nav>

  <!-- Main Container -->
  <div class="section">
    <!-- Profile Header -->
    <div class="profile-header">
      <h1 id="userName">Welcome!</h1>
      <p class="email" id="userEmail"></p>
    </div>

    <!-- Stats -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="number" id="totalBookings">0</div>
        <div class="label">Total Bookings</div>
      </div>
      <div class="stat-card">
        <div class="number" id="confirmedBookings">0</div>
        <div class="label">Confirmed</div>
      </div>
      <div class="stat-card">
        <div class="number" id="totalSpent">PKR 0</div>
        <div class="label">Total Spent</div>
      </div>
    </div>

    <!-- Bookings Section -->
    <div class="bookings-section">
      <h2 class="section-title">My Bookings</h2>
      <div id="bookingsContent" class="loading">Loading your bookings</div>
    </div>
  </div>

  <!-- Booking Details Modal -->
  <div id="bookingModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Booking Details</h2>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modalDetails"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2025 Explore Pakistan. All rights reserved.
  </footer>

  <!-- Notification System -->
  <script src="notification-system.js"></script>
  
  <!-- API Configuration -->
  <script src="api-config.js"></script>

  <script>
    // Get user from localStorage
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    const userId = localStorage.getItem('userId');
    
    // Store current booking for PDF generation
    let currentBooking = null;

    // Redirect if not logged in
    if (!user || !userId) {
      alert('Please login to view your profile');
      window.location.href = 'front end code.html';
    }

    // Display user info
    document.getElementById('userName').textContent = `Welcome, ${user.full_name || 'User'}!`;
    document.getElementById('userEmail').textContent = user.email || '';

    // Logout functionality
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const confirmed = await Notify.confirm(
        'Are you sure you want to logout from your account?',
        { title: 'Logout?', confirmText: 'Logout', type: 'warning' }
      );
      if (confirmed) {
        const loader = Notify.loading('Logging you out...');
        setTimeout(() => {
          localStorage.removeItem('user');
          localStorage.removeItem('userId');
          loader.hide();
          Notify.success('You have been logged out successfully.', 'Logged Out');
          setTimeout(() => {
            window.location.href = 'front end code.html';
          }, 1500);
        }, 500);
      }
    });

    // Read local bookings from localStorage and normalize to API format
    function getLocalBookings() {
      try {
        const raw = JSON.parse(localStorage.getItem('myBookings') || '[]');
        return raw.map(b => ({
          booking_id:     b.id || ('local-' + Date.now() + Math.random()),
          hotel_name:     b.hotel || b.destination || 'Hotel',
          user_name:      b.name || (user ? user.full_name : ''),
          email:          b.email || (user ? user.email : ''),
          check_in:       b.date || b.check_in,
          check_out:      b.checkout || b.check_out,
          price_paid:     b.total || b.price_paid || 0,
          booking_status: b.booking_status || 'confirmed',
          created_at:     b.created_at || new Date().toISOString(),
          _isLocal:       true
        }));
      } catch(e) {
        return [];
      }
    }

    // Load bookings from API, falling back to / merging with localStorage
    async function loadBookings() {
      let apiBookings = [];
      let apiOk = false;

      try {
        const result = await API.getAllBookings(userId);
        if (result && result.length > 0) {
          apiBookings = result;
          apiOk = true;
        }
      } catch (error) {
        console.warn('API unavailable, will use localStorage:', error);
      }

      // Always merge with localStorage bookings (catches fallback saves)
      const localBookings = getLocalBookings();

      // Deduplicate: if a local booking id already appears in API results, skip it
      const apiIds = new Set(apiBookings.map(b => String(b.booking_id)));
      const uniqueLocal = localBookings.filter(b => !apiIds.has(String(b.booking_id)));

      const allBookings = [...apiBookings, ...uniqueLocal];

      if (allBookings.length === 0) {
        showEmptyState();
        return;
      }

      updateStats(allBookings);
      renderBookings(allBookings);
    }

    function updateStats(bookings) {
      const totalBookings = bookings.length;
      const confirmedBookings = bookings.filter(b => b.booking_status === 'confirmed').length;
      const totalSpent = bookings.reduce((sum, b) => sum + (parseFloat(b.price_paid) || 0), 0);

      document.getElementById('totalBookings').textContent = totalBookings;
      document.getElementById('confirmedBookings').textContent = confirmedBookings;
      document.getElementById('totalSpent').textContent = `PKR ${totalSpent.toLocaleString()}`;
    }

    function renderBookings(bookings) {
      const container = document.getElementById('bookingsContent');
      container.innerHTML = '';
      container.className = 'bookings-grid';

      bookings.forEach(booking => {
        const card = createBookingCard(booking);
        container.appendChild(card);
      });
    }

    function createBookingCard(booking) {
      const card = document.createElement('div');
      card.className = 'booking-card';
      card.onclick = () => showBookingDetails(booking);

      // Calculate nights
      const checkIn = new Date(booking.check_in);
      const checkOut = new Date(booking.check_out);
      const nights = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));

      // Format dates
      const checkInStr = checkIn.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      const checkOutStr = checkOut.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

      // Status badge
      const statusClass = `status-${booking.booking_status || 'pending'}`;
      const statusText = (booking.booking_status || 'pending').charAt(0).toUpperCase() + (booking.booking_status || 'pending').slice(1);

      card.innerHTML = `
        <div class="booking-header">
          <div>
            <h3>${booking.hotel_name || 'Hotel'}</h3>
            <div class="booking-id">Booking #${booking.booking_id}</div>
          </div>
          <span class="status-badge ${statusClass}">${statusText}</span>
        </div>
        <div class="booking-details">
          <div class="detail-item">
            <strong>Check-in:</strong> ${checkInStr}
          </div>
          <div class="detail-item">
            <strong>Check-out:</strong> ${checkOutStr}
          </div>
          <div class="detail-item">
            <strong>Nights:</strong> ${nights}
          </div>
          <div class="detail-item">
            <strong>Booked:</strong> ${new Date(booking.created_at).toLocaleDateString()}
          </div>
        </div>
        <div class="booking-price">PKR ${parseFloat(booking.price_paid || 0).toLocaleString()}</div>
      `;

      return card;
    }

    function showBookingDetails(booking) {
      // Store current booking for PDF generation
      currentBooking = booking;
      
      const modal = document.getElementById('bookingModal');
      const modalDetails = document.getElementById('modalDetails');

      // Calculate nights
      const checkIn = new Date(booking.check_in);
      const checkOut = new Date(booking.check_out);
      const nights = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));

      // Format dates
      const checkInStr = checkIn.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      const checkOutStr = checkOut.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      const bookedDate = new Date(booking.created_at).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

      // Status badge
      const statusClass = `status-${booking.booking_status || 'pending'}`;
      const statusText = (booking.booking_status || 'pending').charAt(0).toUpperCase() + (booking.booking_status || 'pending').slice(1);

      modalDetails.innerHTML = `
        <div class="detail-row">
          <span class="detail-label">Booking ID</span>
          <span class="detail-value">#${booking.booking_id}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Hotel Name</span>
          <span class="detail-value">${booking.hotel_name || 'N/A'}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Guest Name</span>
          <span class="detail-value">${booking.user_name || user.full_name}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email</span>
          <span class="detail-value">${booking.email || user.email}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Check-in Date</span>
          <span class="detail-value">${checkInStr}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Check-out Date</span>
          <span class="detail-value">${checkOutStr}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Number of Nights</span>
          <span class="detail-value">${nights} night${nights > 1 ? 's' : ''}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Booking Status</span>
          <span class="detail-value"><span class="status-badge ${statusClass}">${statusText}</span></span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Total Amount</span>
          <span class="detail-value" style="font-size: 1.3rem; color: var(--rose-500);">PKR ${parseFloat(booking.price_paid || 0).toLocaleString()}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Booked On</span>
          <span class="detail-value">${bookedDate}</span>
        </div>
        <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid var(--rose-200); display: flex; gap: 12px; flex-wrap: wrap;">
          <button onclick="downloadBookingPDF('${booking.booking_id}')" class="btn-download" id="downloadBtn-${booking.booking_id}">
            <svg style="width: 18px; height: 18px; margin-right: 8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            Download PDF
          </button>
          ${(booking.booking_status !== 'cancelled') ? `
          <button onclick="cancelBooking(${booking.booking_id})" class="btn-cancel" id="cancelBtn-${booking.booking_id}">
            <svg style="width: 18px; height: 18px; margin-right: 8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            Cancel Booking
          </button>
          ` : ''}
        </div>
      `;

      modal.classList.add('show');
    }

    function closeModal() {
      document.getElementById('bookingModal').classList.remove('show');
    }

    async function downloadBookingPDF(bookingId) {
      try {
        const { jsPDF } = window.jspdf;
        
        // Use the current booking
        const booking = currentBooking;
        if (!booking || String(booking.booking_id) !== String(bookingId)) {
          Notify.error('Booking not found', 'Error');
          return;
        }

        // Show loading notification
        const loader = Notify.loading('Generating PDF...');

        // Create new PDF document
        const doc = new jsPDF();
        
        // Set colors
        const primaryColor = [184, 92, 114]; // Rose-500
        const textColor = [42, 42, 42];
        const lightGray = [200, 200, 200];

        // Add logo/header
        doc.setFillColor(...primaryColor);
        doc.rect(0, 0, 210, 40, 'F');
        
        doc.setTextColor(255, 255, 255);
        doc.setFontSize(24);
        doc.setFont('helvetica', 'bold');
        doc.text('Explore Pakistan', 105, 20, { align: 'center' });
        
        doc.setFontSize(12);
        doc.setFont('helvetica', 'normal');
        doc.text('Booking Confirmation', 105, 30, { align: 'center' });

        // Reset text color
        doc.setTextColor(...textColor);

        // Booking details
        let yPos = 55;
        
        // Title
        doc.setFontSize(16);
        doc.setFont('helvetica', 'bold');
        doc.text('Booking Details', 20, yPos);
        
        yPos += 10;
        doc.setLineWidth(0.5);
        doc.setDrawColor(...lightGray);
        doc.line(20, yPos, 190, yPos);
        
        yPos += 10;

        // Calculate nights
        const checkIn = new Date(booking.check_in);
        const checkOut = new Date(booking.check_out);
        const nights = Math.ceil((checkOut - checkIn) / (1000 * 60 * 60 * 24));

        // Format dates
        const checkInStr = checkIn.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        const checkOutStr = checkOut.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
        const bookedDate = new Date(booking.created_at).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

        // Details array
        const details = [
          { label: 'Booking ID:', value: `#${booking.booking_id}` },
          { label: 'Hotel Name:', value: booking.hotel_name || 'N/A' },
          { label: 'Guest Name:', value: booking.user_name || user.full_name },
          { label: 'Email:', value: booking.email || user.email },
          { label: 'Check-in Date:', value: checkInStr },
          { label: 'Check-out Date:', value: checkOutStr },
          { label: 'Number of Nights:', value: `${nights} night${nights > 1 ? 's' : ''}` },
          { label: 'Booking Status:', value: (booking.booking_status || 'pending').toUpperCase() },
          { label: 'Booked On:', value: bookedDate }
        ];

        doc.setFontSize(11);
        details.forEach(detail => {
          doc.setFont('helvetica', 'bold');
          doc.text(detail.label, 20, yPos);
          doc.setFont('helvetica', 'normal');
          doc.text(detail.value, 80, yPos);
          yPos += 8;
        });

        // Total amount box
        yPos += 5;
        doc.setFillColor(253, 238, 241);
        doc.roundedRect(20, yPos - 5, 170, 20, 3, 3, 'F');
        
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        doc.setTextColor(...primaryColor);
        doc.text('Total Amount:', 25, yPos + 5);
        doc.text(`PKR ${parseFloat(booking.price_paid || 0).toLocaleString()}`, 185, yPos + 5, { align: 'right' });
        
        doc.setTextColor(...textColor);
        yPos += 30;

        // Footer
        doc.setFontSize(9);
        doc.setFont('helvetica', 'italic');
        doc.setTextColor(128, 128, 128);
        doc.text('Thank you for choosing Explore Pakistan!', 105, 270, { align: 'center' });
        doc.text('For inquiries, contact us at info@explorepakistan.com', 105, 277, { align: 'center' });
        
        // Add border
        doc.setDrawColor(...primaryColor);
        doc.setLineWidth(1);
        doc.rect(10, 45, 190, 235);

        // Save PDF
        doc.save(`booking-${booking.booking_id}.pdf`);
        
        loader.hide();
        Notify.success('PDF downloaded successfully!', 'Success');
      } catch (error) {
        console.error('PDF generation error:', error);
        Notify.error('Failed to generate PDF. Please try again.', 'Error');
      }
    }

    async function cancelBooking(bookingId) {
      const confirmed = await Notify.confirm(
        'Are you sure you want to cancel this booking? This action cannot be undone and any payments will be processed according to the cancellation policy.',
        { title: 'Cancel Booking?', confirmText: 'Cancel Booking', isDanger: true }
      );
      if (!confirmed) {
        return;
      }

      const cancelBtn = document.getElementById(`cancelBtn-${bookingId}`);
      if (cancelBtn) {
        cancelBtn.disabled = true;
        cancelBtn.innerHTML = '<span style="display: inline-block; animation: spin 1s linear infinite;">⏳</span> Cancelling...';
      }

      try {
        const loader = Notify.loading('Cancelling your booking...');
        const result = await API.updateBooking(bookingId, { booking_status: 'cancelled' });
        loader.hide();
        
        // Show success message
        Notify.success('Your booking has been cancelled successfully.', 'Booking Cancelled');
        
        // Close modal
        closeModal();
        
        // Reload bookings to show updated status
        await loadBookings();
      } catch (error) {
        console.error('Error cancelling booking:', error);
        Notify.error('Unable to cancel booking. Please try again later or contact support.', 'Cancellation Failed');
        
        if (cancelBtn) {
          cancelBtn.disabled = false;
          cancelBtn.innerHTML = `
            <svg style="width: 18px; height: 18px; margin-right: 8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
            Cancel Booking
          `;
        }
      }
    }

    function showEmptyState() {
      const container = document.getElementById('bookingsContent');
      container.innerHTML = `
        <div class="empty-state">
          <h3>No Bookings Yet</h3>
          <p>You haven't made any bookings yet. Start exploring amazing destinations!</p>
          <a href="front end code.html" class="btn-primary">Browse Hotels</a>
        </div>
      `;
      
      // Reset stats
      document.getElementById('totalBookings').textContent = '0';
      document.getElementById('confirmedBookings').textContent = '0';
      document.getElementById('totalSpent').textContent = 'PKR 0';
    }

    // Close modal when clicking outside
    document.getElementById('bookingModal').addEventListener('click', (e) => {
      if (e.target.id === 'bookingModal') {
        closeModal();
      }
    });

    // Load bookings on page load
    loadBookings();
  </script>
</body>
</html>
