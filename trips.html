/* RANDOM POINT GENERATOR */
function randomPointAround(lat, lng, r = 0.6){
  const rd = r/111.32;
  const u = Math.random(), v = Math.random();
  const w = rd * Math.sqrt(u);
  const t = 2 * Math.PI * v;
  const dx = w * Math.cos(t), dy = w * Math.sin(t);
  return { lat: lat + dy, lng: lng + dx / Math.cos(lat*Math.PI/180) };
}

/* ============================
   Load trip from backend or localStorage
============================ */
async function loadTripData() {
  const urlParams = new URLSearchParams(window.location.search);
  const tripId = urlParams.get('id');
  
  try {
    // If trip ID in URL, fetch from backend
    if (tripId) {
      const loader = Notify.loading('Loading trip details...');
      const trip = await API.getTrip(tripId);
      loader.hide();
      
      if (trip) {
        return {
          trip_id: trip.trip_id,
          destination: trip.destination_name,
          date: trip.trip_date || 'Not specified',
          time: trip.trip_time || 'Not specified',
          description: trip.description || 'No description provided',
          selected_hotels: trip.selected_hotels || []
        };
      }
    }
    
    // Fallback to localStorage
    const stored = localStorage.getItem("currentTrip");
    if (stored) {
      const trip = JSON.parse(stored);
      return {
        destination: trip.destination,
        date: trip.date,
        time: trip.time,
        description: trip.description || `Trip to ${trip.destination}`,
        selected_hotels: []
      };
    }
    
    // If no trip found, show error
    throw new Error('No trip data found');
    
  } catch (error) {
    console.error('Error loading trip:', error);
    Notify.error('Unable to load trip. Redirecting to home...', 'Error');
    setTimeout(() => {
      window.location.href = 'front end code.html';
    }, 2000);
    return null;
  }
}

/* ============================
   Render trip details
============================ */
async function renderTrip() {
  const tripData = await loadTripData();
  if (!tripData) return;
  
  const box = document.getElementById("tripContainer");
  const destKey = tripData.destination;
  const imgs = destinationImages[destKey] || [];
  
  // Fetch hotels for this destination from backend
  let hotels = [];
  try {
    const allHotels = await API.getHotels();
    hotels = allHotels.filter(h => 
      h.destination_name && h.destination_name.toLowerCase() === destKey.toLowerCase()
    );
    
    // If trip has selected hotels, prioritize those
    if (tripData.selected_hotels && tripData.selected_hotels.length > 0) {
      hotels = tripData.selected_hotels;
    }
  } catch (error) {
    console.error('Error loading hotels:', error);
  }

  box.innerHTML = `
    <div class="trip-card">

      <div class="gallery">
        ${
          imgs.length
          ? imgs.map(src => `<img src="${src}" alt="${destKey}">`).join("")
          : `<div style="grid-column:1/-1;text-align:center;color:var(--muted)">No images</div>`
        }
      </div>

      <h2 class="trip-title">${tripData.destination}</h2>

      <div class="trip-details">
        <p><strong>Date:</strong> ${tripData.date}</p>
        <p><strong>Time:</strong> ${tripData.time}</p>
        <p><strong>Description:</strong> ${tripData.description}</p>
      </div>

      <h3 class="hotels-title">${tripData.selected_hotels && tripData.selected_hotels.length > 0 ? 'Selected Hotels' : 'Available Hotels'}</h3>
      <div class="hotel-grid" id="hotelGrid">
        ${hotels.length
          ? hotels.map((h)=>`
            <div class="hotel-card">
              <h4>${h.hotel_name || h.name}</h4>
              <p><strong>Price:</strong> PKR ${parseFloat(h.price || 0).toLocaleString()}/night</p>
              <p><strong>Rating:</strong> ★ ${h.rating || 'N/A'}</p>
              <button class="book-btn" onclick="bookHotel('${h.hotel_id || ''}', '${(h.hotel_name || h.name || '').replace(/'/g, "\\'")}'', '${h.price || 0}', '${h.rating || 0}')">
                Book Now
              </button>
            </div>
          `).join("")
          : `<p style="color:var(--muted)">No hotels available for this destination.</p>`
        }



      </div>

      <div id="map"></div>
    </div>
  `;

  /* MAP INIT */
  const destCoords = coordinates[destKey];
  if (destCoords) {
    const map = L.map("map").setView([destCoords.lat, destCoords.lng], 11);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

    L.marker([destCoords.lat, destCoords.lng]).addTo(map)
      .bindPopup(`<b>${destKey}</b>`);

    // Add hotel markers
    const markers = [];
    hotels.forEach((hotel)=>{
      const lat = parseFloat(hotel.latitude) || destCoords.lat + (Math.random() - 0.5) * 0.05;
      const lng = parseFloat(hotel.longitude) || destCoords.lng + (Math.random() - 0.5) * 0.05;
      
      const mk = L.marker([lat, lng]).addTo(map)
        .bindPopup(`<b>${hotel.hotel_name || hotel.name}</b><br>Price: PKR ${parseFloat(hotel.price || 0).toLocaleString()}/night<br>Rating: ★ ${hotel.rating || 'N/A'}`);
      markers.push(mk);
    });

    // Fit bounds if we have hotels
    if (markers.length > 0) {
      const group = new L.featureGroup([
        L.marker([destCoords.lat, destCoords.lng]),
        ...markers
      ]);
      map.fitBounds(group.getBounds().pad(0.25));
    }
  }
}



/* ============================
   Book hotel
============================ */
function bookHotel(id, name, price, rating) {
  const hotel = {
    id: id,
    name: name,
    price: price,
    rating: rating
  };
  localStorage.setItem("selectedHotel", JSON.stringify(hotel));
  window.location.href = `hotel bookings.html?hotel=${encodeURIComponent(name)}&id=${id}`;
}
